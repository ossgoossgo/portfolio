<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note AI 智慧筆記 | Ossgo Wang</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Ossgo Wang</a>
      <div class="nav-links">
        <a href="../index.html#works" data-i18n="nav.works">作品</a>
        <button class="lang-toggle" id="langToggle">EN</button>
      </div>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <a href="../index.html#works" class="back-link" data-i18n="project.back">← 返回作品集</a>

      <header class="project-header">
        <h1 data-i18n="projects.note-ai.name">Note AI 智慧筆記</h1>
        <div class="project-meta">
          <span class="project-year">2026</span>
          <div class="project-tech-tags">
            <span class="work-card-tag">Next.js</span>
            <span class="work-card-tag">LLM</span>
            <span class="work-card-tag">AI</span>
          </div>
        </div>
      </header>

      <section class="project-gallery">
        <div class="gallery-grid">
          <img src="../assets/images/note-ai-1.jpg" alt="新增筆記" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/note-ai-2.jpg" alt="筆記內容" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/note-ai-3.jpg" alt="筆記列表" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/note-ai-4.jpg" alt="標籤篩選" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/note-ai-5.jpg" alt="搜尋功能" loading="lazy" onclick="openLightbox(this)">
        </div>
      </section>

      <section class="project-description">
        <p data-i18n="projects.note-ai.description">「連結變筆記」系統，使用者只需提交 YouTube 影片或網頁 URL，系統即自動擷取內容，透過本地 LLM 進行分析，產出結構化筆記，並自動生成標籤與封面圖片，支援全文搜尋與標籤篩選。</p>
      </section>

      <section class="project-features">
        <h3 data-i18n="project.features">功能特色</h3>
        <ul>
          <li>非同步任務佇列，支援進度追蹤與自動重試</li>
          <li>AI 自動判斷內容類型（食譜 vs. 文章）</li>
          <li>自動標籤生成</li>
          <li>全文搜尋</li>
          <li>重複 URL 偵測</li>
        </ul>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-nav lightbox-next" id="lightboxNext"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/project.js"></script>
</body>
</html>
