<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡片編輯 App | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Ossgo Wang</a>
      <div class="nav-links">
        <a href="../index.html#works" data-i18n="nav.works">作品</a>
        <button class="lang-toggle" id="langToggle">EN</button>
      </div>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <a href="../index.html#works" class="back-link" data-i18n="project.back">← 返回作品集</a>

      <header class="project-header">
        <h1 data-i18n="projects.card-editor.name">卡片編輯 App</h1>
        <div class="project-meta">
          <span class="project-year">2021</span>
          <div class="project-tech-tags">
            <span class="work-card-tag">Flutter</span>
            <span class="work-card-tag">Canvas</span>
          </div>
        </div>
      </header>

      <section class="project-gallery">
        <div class="gallery-grid">
          <img src="../assets/images/card-editor-1.png" alt="三階段學習法" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/card-editor-2.png" alt="字卡瀏覽" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/card-editor-3.png" alt="模板選擇" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/card-editor-4.png" alt="編輯工具" loading="lazy" onclick="openLightbox(this)">
        </div>
      </section>

      <section class="project-video">
        <iframe width="100%" height="450" src="https://www.youtube.com/embed/cD6G1x4U7_w" frameborder="0" allowfullscreen style="border-radius:var(--radius);border:1px solid var(--border);max-width:800px;"></iframe>
      </section>

      <section class="project-description">
        <p data-i18n="projects.card-editor.description">2021 年疫情期間開發的字卡編輯工具，基於蒙特梭利三階段學習法（命名、辨識、記憶）。提供預設模板與空白模板，支援文字、圖片、貼紙、形狀等物件的自由編輯，可同步編輯多張卡片、複製貼上、對齊參考線等進階功能。</p>
      </section>

      <section class="project-features">
        <h3 data-i18n="project.features">功能特色</h3>
        <ul>
          <li>多種預設模板</li>
          <li>文字/圖片/貼紙/形狀物件</li>
          <li>注音字體支援</li>
          <li>同步編輯多張卡片</li>
          <li>複製物件/卡片</li>
          <li>對齊參考線</li>
        </ul>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/project.js"></script>
</body>
</html>
