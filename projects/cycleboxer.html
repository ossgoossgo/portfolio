<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拳擊飛輪 CycleBoxer | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Ossgo Wang</a>
      <div class="nav-links">
        <a href="../index.html#works" data-i18n="nav.works">作品</a>
        <button class="lang-toggle" id="langToggle">EN</button>
      </div>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <a href="../index.html#works" class="back-link" data-i18n="project.back">← 返回作品集</a>

      <header class="project-header">
        <h1 data-i18n="projects.cycleboxer.name">拳擊飛輪 CycleBoxer</h1>
        <div class="project-meta">
          <span class="project-year">2018</span>
          <div class="project-tech-tags">
            <span class="work-card-tag">React Native</span>
            <span class="work-card-tag">Bluetooth</span>
            <span class="work-card-tag">Hardware</span>
          </div>
        </div>
      </header>

      <section class="project-gallery">
        <div class="gallery-grid">
          <img src="../assets/images/cycleboxer-1.png" alt="CycleBoxer App" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/cycleboxer-2.jpg" alt="運動設備" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/cycleboxer-3.png" alt="運動畫面" loading="lazy" onclick="openLightbox(this)">
        </div>
      </section>

      <section class="project-description">
        <p data-i18n="projects.cycleboxer.description">2018 年為新創運動器材公司開發的健身 App。結合拳擊沙包機與飛輪腳踏車的複合式運動器材，透過藍牙連接設備與心率帶，即時追蹤出拳準確度、運動進度與心率。支援運動歷史記錄、成績曲線分析、社群分享與韌體 OTA 更新。</p>
      </section>

      <section class="project-features">
        <h3 data-i18n="project.features">功能特色</h3>
        <ul>
          <li>藍牙連接運動設備與心率帶</li>
          <li>即時運動數據追蹤</li>
          <li>運動歷史與成績曲線</li>
          <li>社群分享</li>
          <li>韌體 OTA 更新</li>
        </ul>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/project.js"></script>
</body>
</html>
