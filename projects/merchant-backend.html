<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店家訂單後台 App | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Ossgo Wang</a>
      <div class="nav-links">
        <a href="../index.html#works" data-i18n="nav.works">作品</a>
        <button class="lang-toggle" id="langToggle">EN</button>
      </div>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <a href="../index.html#works" class="back-link" data-i18n="project.back">← 返回作品集</a>

      <header class="project-header">
        <h1 data-i18n="projects.merchant-backend.name">店家訂單後台 App</h1>
        <div class="project-meta">
          <span class="project-year">2020</span>
          <div class="project-tech-tags">
            <span class="work-card-tag">Flutter</span>
            <span class="work-card-tag">Payment</span>
          </div>
        </div>
      </header>

      <section class="project-gallery">
        <div class="gallery-grid">
          <img src="../assets/images/merchant-backend-1.png" alt="啟動頁" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/merchant-backend-2.png" alt="首頁儀表板" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/merchant-backend-3.png" alt="待處理訂單" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/merchant-backend-4.png" alt="菜單編輯" loading="lazy" onclick="openLightbox(this)">
        </div>
      </section>

      <section class="project-description">
        <p data-i18n="projects.merchant-backend.description">2019-2020 年開發的店家訂單管理後台，支援手機與平板 RWD 排版。提供待處理訂單、營運數據儀表板、菜單編輯（主餐/副餐）、廣告輪播管理、會員到店紀錄、信用卡綁定、營收提款等完整後台功能。</p>
      </section>

      <section class="project-features">
        <h3 data-i18n="project.features">功能特色</h3>
        <ul>
          <li>營運數據儀表板</li>
          <li>待處理訂單通知</li>
          <li>菜單編輯管理</li>
          <li>廣告輪播管理</li>
          <li>會員到店紀錄</li>
          <li>營收提款</li>
        </ul>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/project.js"></script>
</body>
</html>
