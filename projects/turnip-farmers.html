<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大頭菜農友會 App | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Ossgo Wang</a>
      <div class="nav-links">
        <a href="../index.html#works" data-i18n="nav.works">作品</a>
        <button class="lang-toggle" id="langToggle">EN</button>
      </div>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <a href="../index.html#works" class="back-link" data-i18n="project.back">← 返回作品集</a>

      <header class="project-header">
        <h1 data-i18n="projects.turnip-farmers.name">大頭菜農友會 App</h1>
        <div class="project-meta">
          <span class="project-year">2020</span>
          <div class="project-tech-tags">
            <span class="work-card-tag">Flutter</span>
            <span class="work-card-tag">Firebase</span>
          </div>
        </div>
      </header>

      <section class="project-gallery">
        <div class="gallery-grid">
          <img src="../assets/images/turnip-farmers-1.png" alt="登入頁" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/turnip-farmers-2.png" alt="首頁" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/turnip-farmers-3.png" alt="搜尋島嶼" loading="lazy" onclick="openLightbox(this)">
          <img src="../assets/images/turnip-farmers-4.png" alt="島嶼管理" loading="lazy" onclick="openLightbox(this)">
        </div>
      </section>

      <section class="project-description">
        <p data-i18n="projects.turnip-farmers.description">2020 年上半年利用下班時間開發的動物森友會玩家社群 App。幫助玩家尋找高菜價島嶼，提供島主開島、訪客搜尋、排隊系統（含密碼通知）、即時聊天、好友追蹤與推播通知等社交功能。</p>
      </section>

      <section class="project-features">
        <h3 data-i18n="project.features">功能特色</h3>
        <ul>
          <li>Apple/Facebook/Google 社群登入</li>
          <li>島主資訊與開島管理</li>
          <li>訪客搜尋島嶼</li>
          <li>排隊系統與密碼通知</li>
          <li>即時聊天</li>
          <li>好友追蹤與推播通知</li>
          <li>最新遊戲攻略</li>
        </ul>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/project.js"></script>
</body>
</html>
