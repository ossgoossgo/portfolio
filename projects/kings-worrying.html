<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Hero 數字英雄 | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Ossgo Wang</a>
      <div class="nav-links">
        <a href="../index.html#works" data-i18n="nav.works">作品</a>
        <button class="lang-toggle" id="langToggle">EN</button>
      </div>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <a href="../index.html#works" class="back-link" data-i18n="project.back">← 返回作品集</a>

      <header class="project-header">
        <h1 data-i18n="projects.kings-worrying.name">Number Hero 數字英雄</h1>
        <div class="project-meta">
          <span class="project-year">2013</span>
          <div class="project-tech-tags">
            <span class="work-card-tag">Cocos2D</span>
            <span class="work-card-tag">遊戲開發</span>
          </div>
        </div>
      </header>

      <section class="gallery-grid">
        <img src="../assets/images/kings-worrying.png" alt="Number Hero 數字英雄" onclick="openLightbox(this)">
      </section>

      <section class="project-video">
        <iframe width="100%" height="450" src="https://www.youtube.com/embed/U_eqcGYWa_s" frameborder="0" allowfullscreen style="border-radius:var(--radius);border:1px solid var(--border);max-width:800px;"></iframe>
      </section>

      <section class="project-description">
        <p data-i18n="projects.kings-worrying.description">2013 年開發的 Cocos2D 遊戲。主要是點擊數字讓數字增加，當 3 個數字一樣時可以消除增加主角的戰力，把怪物打敗後即勝利。</p>
      </section>

      <section class="project-features">
        <h3 data-i18n="project.features">功能特色</h3>
        <ul>
          <li>數字消除機制</li>
          <li>角色成長系統</li>
          <li>怪物戰鬥</li>
        </ul>
      </section>

      <section class="project-links">
        <a href="https://youtu.be/U_eqcGYWa_s" target="_blank" class="project-link-btn">YouTube</a>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/project.js"></script>
</body>
</html>
