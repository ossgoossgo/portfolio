<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明信片寄送 App (Postory) | Portfolio</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/project.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">Ossgo Wang</a>
      <div class="nav-links">
        <a href="../index.html#works" data-i18n="nav.works">作品</a>
        <button class="lang-toggle" id="langToggle">EN</button>
      </div>
    </div>
  </nav>

  <main class="project-page">
    <div class="container">
      <a href="../index.html#works" class="back-link" data-i18n="project.back">← 返回作品集</a>

      <header class="project-header">
        <h1 data-i18n="projects.postcard-app.name">明信片寄送 App (Postory)</h1>
        <div class="project-meta">
          <span class="project-year">2024</span>
          <div class="project-tech-tags">
            <span class="work-card-tag">Flutter</span>
            <span class="work-card-tag">Map API</span>
            <span class="work-card-tag">Location</span>
          </div>
        </div>
      </header>

      <section class="gallery-grid">
        <img src="../assets/images/postcard-hero.png" alt="明信片寄送 App (Postory)" onclick="openLightbox(this)">
        <img src="../assets/images/postcard-unlock.png" alt="明信片寄送 App (Postory)" onclick="openLightbox(this)">
        <img src="../assets/images/postcard-shop.png" alt="明信片寄送 App (Postory)" onclick="openLightbox(this)">
      </section>

      <section class="project-video-grid">
        <video controls>
          <source src="../assets/videos/demo_hero.mp4" type="video/mp4">
        </video>
        <video controls>
          <source src="../assets/videos/demo_search_bar.mp4" type="video/mp4">
        </video>
      </section>

      <section class="project-description">
        <p data-i18n="projects.postcard-app.description">結合地圖探索與景點解鎖的明信片寄送應用，使用者可透過到達特定地點解鎖景點、收集明信片並寄送給好友。</p>
      </section>

      <section class="project-features">
        <h3 data-i18n="project.features">功能特色</h3>
        <ul>
          <li>景點解鎖機制</li>
          <li>地圖搜尋</li>
          <li>明信片收集與寄送</li>
          <li>商店系統</li>
        </ul>
      </section>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <img src="" alt="" id="lightboxImg">
    <button class="lightbox-nav lightbox-next" id="lightboxNext" ><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>

  <script src="../js/i18n.js"></script>
  <script src="../js/project.js"></script>
</body>
</html>
