      <section class="project-description">
        <p data-i18n="projects.danei-master.description">「大內高手 門鎖專家」是一款專為鎖匠設計的派工應用程式。透過 LINE 登入，鎖匠師傅即時接收系統分配的工單通知，可立即安排是否接單、施工時間、並查閱施工內容與歷史紀錄。施工完成後，客戶可直接在 App 內進行驗收確認，提升服務效率。</p>
      </section>

          <li>施工排程與紀錄管理</li>
          <li>客戶驗收流程整合</li>
        </ul>
      </section>
